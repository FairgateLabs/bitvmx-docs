<!-- Custom styling to integrate rustdoc with BitVMX Material theme -->
<style>
    :root {
        /* Override rustdoc colors to match Material orange theme */
        --main-background-color: #ffffff;
        --main-color: rgba(0, 0, 0, 0.87);
        --link-color: #ff6f00;
        --code-highlight-kw-color: #8959a8;
        --code-highlight-kw-2-color: #4271ae;
        --code-highlight-trait-color: #c97500;
        --code-highlight-macro-color: #3e999f;
        --code-highlight-function-color: #4271ae;
        --code-highlight-string-color: #718c00;
        --code-highlight-number-color: #ff6f00;
        --code-highlight-bool-val-color: #c97500;
        --code-highlight-self-color: #c97500;
        --code-highlight-lifetime-color: #f5871f;
        --code-highlight-prelude-ty-color: #c97500;
        --code-highlight-comment-color: #8e908c;
        --sidebar-background-color: #fafafa;
        --sidebar-background-color-hover: #ffe0b2;
        --border-color: #e0e0e0;
        --search-result-link-focus-background-color: #fff3e0;
    }

    /* Dark mode support */
    [data-theme="dark"],
    body.dark-mode {
        --main-background-color: #1e1e1e;
        --main-color: rgba(255, 255, 255, 0.87);
        --link-color: #ff8f00;
        --code-highlight-kw-color: #b388ff;
        --code-highlight-kw-2-color: #9fa8da;
        --code-highlight-trait-color: #ffab40;
        --code-highlight-macro-color: #4db6ac;
        --code-highlight-function-color: #9fa8da;
        --code-highlight-string-color: #81c784;
        --code-highlight-number-color: #ff8f00;
        --code-highlight-bool-val-color: #ffab40;
        --code-highlight-self-color: #ffab40;
        --code-highlight-lifetime-color: #ff8f00;
        --code-highlight-prelude-ty-color: #ffab40;
        --code-highlight-comment-color: #9e9e9e;
        --sidebar-background-color: #252525;
        --sidebar-background-color-hover: #3d2800;
        --border-color: #404040;
        --search-result-link-focus-background-color: #3d2800;
    }

    /* Make links more prominent with BitVMX orange */
    a {
        color: var(--link-color);
    }

    a:hover {
        color: var(--link-color);
        text-decoration: underline;
    }

    /* Style the top navigation bar */
    nav.sidebar {
        border-right: 1px solid var(--border-color);
    }

    /* Improve code block styling */
    pre.rust {
        background-color: var(--main-background-color);
        border: 1px solid var(--border-color);
        border-radius: 4px;
    }

    /* Enhance search results */
    .search-results a {
        color: var(--link-color);
    }

    .search-results a:hover,
    .search-results a:focus {
        background-color: var(--search-result-link-focus-background-color);
    }
</style>
